name: Usenet edition checks
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: usenet-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend and run backend regression tests
        run: docker build --target checks -f Dockerfile.usenet .
